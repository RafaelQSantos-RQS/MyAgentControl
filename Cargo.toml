[package]
name = "myagentcontrol"
version = "0.0.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
indexmap = { version = "2", features = ["serde"] }
indicatif = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.0.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.19"
