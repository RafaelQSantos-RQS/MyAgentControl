[package]
name = "myagentcontrol"
version = "0.0.1"
edition = "2024"
description = "A Rust configuration manager for OpenCode-compatible agent trees"
license = "MIT"
repository = "https://github.com/RafaelQSantos-RQS/MyAgentControl"
readme = "README.md"
keywords = ["opencode", "agents", "configuration", "sdd"]
categories = ["command-line-utilities", "config"]

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
hex = "0.4"
include_dir = "0.7.4"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2.0.19"
