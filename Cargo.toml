[package]
name = "myagentcontrol"
version = "0.0.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
hex = "0.4"
include_dir = "0.7.4"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.19"
