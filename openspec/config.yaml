schema: spec-driven

context: |
  Project: myagentcontrol — Rust reimplementation of OpenAgentsControl (OAC v0.7.1)
  License: MIT + attribution to OpenAgentsControl
  Spec-Driven Development: no implementation without approved spec
  Specs written in English; modular (one master + one per module)
  Acceptance criteria in Given/When/Then form
  Quality gates: cargo test, cargo clippy -- -D warnings, cargo fmt --check, zero unsafe
  Managed format: markdown + YAML frontmatter (byte-compatible with OpenCode)
  The binary is a configuration manager — never executes agents or calls model APIs
  Model-agnosticism: delegate execution to user's chosen CLI

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task must be verifiable
  specs:
    - Use SHALL/MUST for normative requirements (avoid should/may)
    - Every requirement MUST have at least one scenario
    - Use WHEN/THEN format for scenarios

operations:
  archive:
    guidance:
      - Summarize the archive outcome before finishing
      - Verify all capability directories exist after archive
